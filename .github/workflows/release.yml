# Run by hand only (Actions → release → Run workflow) → build the universal macOS .dmg and publish it as release vX.Y.Z.
# A version that already has a release is skipped.
# Signing + notarization turn on by themselves when these repository secrets exist (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE (base64 of the Developer ID Application .p12), APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY ("Developer ID Application: Name (TEAMID)"), APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
# Without them the build is unsigned (users open it via Privacy & Security → Open Anyway).
name: release

# Releases are built, signed and notarized on the maintainer's Mac (scripts/release-signed.sh) to save Actions minutes,
# so this workflow only runs when started by hand (Actions → release → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "$TAG is already released"
          fi
      - if: steps.v.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - if: steps.v.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            src-tauri
      - if: steps.v.outputs.skip != 'true'
        run: npm ci
      - if: steps.v.outputs.skip != 'true'
        name: Test
        run: npm run check
      - if: steps.v.outputs.skip != 'true'
        name: Build universal .dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # empty secrets would make tauri try (and fail) to sign: drop them when not set
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx tauri build --target universal-apple-darwin --bundles dmg
      - if: steps.v.outputs.skip != 'true'
        name: Package
        run: |
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg Server-Hub-mac.dmg
          shasum -a 256 Server-Hub-mac.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - if: steps.v.outputs.skip != 'true'
        name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; fi
          NOTES=$(awk -v t="## ${TAG#v}" '$0 ~ "^## " {p = ($0 == t)} p && !/^## /' CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Server-Hub-mac.dmg SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" Server-Hub-mac.dmg SHA256SUMS.txt --title "Server Hub ${TAG#v}" --notes "${NOTES:-Server Hub $TAG}"
          fi
