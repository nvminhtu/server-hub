[package]
name = "server-hub"
version = "0.1.0"
edition = "2021"

[lib]
name = "server_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"
hub-core = { path = "../core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
